<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D News Globe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: sans-serif; }
        #globeViz { width: 100vw; height: 100vh; }
        
        /* Floating UI Panel for news data */
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            max-width: 300px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none; /* Let mouse clicks pass through to the globe */
            transition: opacity 0.3s ease;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .hint { color: #94a3b8; font-size: 0.9rem; }
    </style>

    <!-- Load Globe.gl (Includes Three.js inside it) -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>

    <div id="globeViz"></div>

    <div id="info-panel">
        <h2 id="country-name">Select a Country</h2>
        <p id="country-info" class="hint">Click on a country to trigger your News API workflow.</p>
        <div id="news-feed"></div>
    </div>

    <script>
        // Container element
        const element = document.getElementById('globeViz');

        // Initialize the globe
        const myGlobe = Globe()(element)
            // 1. Setup appearance
            .backgroundColor('#0b0f19')
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            
            // 2. Load and render country polygons (GeoJSON)
            // This public dataset gives us the boundary shapes and ISO codes
            .polygonsData('https://unpkg.com/three-globe/example/datasets/ne_110m_admin_0_countries.geojson')
            .polygonAltitude(0.006) // Raises the countries slightly above the ocean floor
            .polygonCapColor(() => 'rgba(56, 189, 248, 0.15)') // Default country tint
            .polygonSideColor(() => 'rgba(255, 255, 255, 0.05)')
            .polygonStrokeColor(() => '#0ea5e9') // Country borders
            
            // 3. Hover Effects
            .onPolygonHover(hoverD => myGlobe
                .polygonCapColor(d => d === hoverD ? 'rgba(239, 68, 68, 0.4)' : 'rgba(56, 189, 248, 0.15)') // Turn red on hover
            )
            
            // 4. Click Event for your News API Integration
            .onPolygonClick(({ properties: d }) => {
                // Accessing the GeoJSON properties
                const countryName = d.NAME;
                const countryCode = d.ISO_A2; // e.g., "US", "FR", "JP" (Perfect for API queries)

                // Update UI Panel
                document.getElementById('country-name').innerText = countryName;
                document.getElementById('country-info').className = "";
                document.getElementById('country-info').innerText = `Fetching news for code: ${countryCode}...`;

                // --- TRIGGER YOUR NEWS API HERE ---
                fetchNews(countryName, countryCode);
            });

        // Set initial camera view
        myGlobe.controls().autoRotate = true;
        myGlobe.controls().autoRotateSpeed = 0.3;
        myGlobe.pointOfView({ lat: 20, lng: 0, altitude: 2.0 });

        // Pause auto-rotation when the user manually drags the globe
        myGlobe.controls().addEventListener('start', () => {
            myGlobe.controls().autoRotate = false;
        });

        // --- MOCK NEWS API FUNCTION ---
        function fetchNews(name, code) {
            console.log(`Ready to trigger endpoint: https://newsapi.org/v2/top-headlines?country=${code}`);
            
            // Example layout placeholder showing where your JSON data will map:
            setTimeout(() => {
                document.getElementById('country-info').innerText = `Latest headlines from ${name}:`;
                document.getElementById('news-feed').innerHTML = `
                    <ul style="padding-left: 15px; margin-top: 10px; font-size:0.9rem; line-height: 1.4;">
                        <li>Breaking news placeholder for ${code}</li>
                        <li>Local policy shifts update</li>
                    </ul>
                `;
            }, 500); 
        }
    </script>
</body>
</html>
